name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.18", "1.22", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -cover ./...

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - run: go test -race ./...

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # Only the targets we actually care about are built:
  #   linux/amd64             servers and CI x86-64
  #   linux/arm64             Raspberry Pi 3/4/5 with a 64-bit OS, generic ARM64 servers
  #   linux/arm  (GOARM=6/7)  older Raspberry Pis: ARMv6 for Pi 1 and Zero, ARMv7 for Pi 2 v1.2+
  #                           and Pi 3/4/5 running a 32-bit OS
  #   darwin/arm64            macOS on Apple Silicon
  #   windows/amd64,arm64     Windows on x86-64 and ARM64
  # darwin/amd64 is intentionally absent: Intel Macs are end-of-life and the remaining ones run
  # Linux. The package still builds there; it is simply not a target we gate on.
  cross-compile:
    name: cross-compile (${{ matrix.goos }}, ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"

  # 32-bit ARM Linux needs GOARM, which is not part of GOOS/GOARCH, so it gets its own job.
  cross-compile-linux-arm32:
    name: cross-compile (linux, arm, goarm=${{ matrix.goarm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarm: ["6", "7"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - run: go build ./...
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
